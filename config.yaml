# ===== webull-quant 配置 =====

# 交易标的池，按板块分组（同时作为下单白名单，池外股票一律拒绝）
# 同一板块最多同时持有 risk.max_per_group 只，避免高度相关的股票一起买满
universe:
  index:     [SPY, QQQ]
  megacap:   [AAPL, MSFT, NVDA, AMZN, GOOGL, META]
  semis:     [AMD, AVGO, TSM]
  memory:    [MU, WDC, STX, SNDK]          # 存储
  optical:   [COHR, LITE, FN, CIEN, AAOI]  # 光模块 / 光通信
  # SOXL / SOXS 由半导体波段系统（下面的 swing）专门管理，不放在选股池里，避免两套系统交易同一只
  defensive: [KO, MCD]

# 杠杆 / 反向 ETF：仓位按杠杆倍数缩小；反向 ETF 不受大盘过滤限制（大盘越弱越可能有信号）
instruments:
  SOXL: {leverage: 3}
  SOXS: {leverage: 3, inverse: true}

# 执行模式:
#   dry_run  - 只打印决策和订单，不调用下单接口
#   paper    - 本地模拟撮合（不连 Webull 下单）
#   webull   - 调用 Webull 下单接口（环境由 .env 的 WEBULL_ENVIRONMENT 决定）
mode: dry_run

# 实盘总开关。即使 WEBULL_ENVIRONMENT=prod，这里不为 true 也不会下实盘单。
# 另外运行时还需要加 --confirm-live 参数。三道锁缺一不可。
live_trading_enabled: false

# ---- 规则层：技术面筛选（产生候选，AI 只能在候选里做决定）----
strategy:
  sma_fast: 50
  sma_slow: 200
  rsi_period: 14
  rsi_max_entry: 70        # RSI 高于此值不追高
  momentum_lookback: 20    # 20 日动量需 > 0
  atr_period: 14
  atr_stop_mult: 2.5       # 跟踪止损 = 最高收盘价 - N * ATR
  exit_below_fast_sma: true
  # 反向 ETF（instruments 里 inverse: true）专用的短线规则
  # 回测（2022-2026）里这套规则是亏的：23 笔、胜率 17%、合计 -1,453。先在沙盒里前向观察，实盘前建议关掉
  inverse_rule:
    enabled: true              # false = 不再买入反向 ETF（已有持仓仍按规则卖出）
    sma_fast: 20
    sma_slow: 50
    momentum_lookback: 10
    rsi_max_entry: 80
    atr_stop_mult: 2.0         # 比普通股票更紧
    max_hold_days: 15          # 杠杆 ETF 每天重置会损耗，持有满 15 个交易日强制卖出
    require_weak_index: true   # 至少一个大盘指数跌破 SMA50 才允许买入
  # 大盘趋势过滤：基准指数跌破长期均线时停止开新仓，只执行卖出和止损
  market_filter:
    enabled: true
    symbols: [SPY, QQQ]
    ma: sma_slow             # sma_slow = SMA200（长期趋势）；sma_fast = SMA50（更敏感）
    mode: any                # any = 任一指数走弱就停；all = 全部走弱才停

# ---- 审核层 ----
ai:
  # claude_code - 由 Claude Code 审核候选并写 decisions.json（用订阅额度，程序不调用付费 API）
  # api         - 程序直接调用 Claude API（按 token 计费，需要 ANTHROPIC_API_KEY）
  # off         - 不审核，规则信号直接进入风控
  mode: claude_code
  min_confidence: 0.6      # 低于此置信度的 BUY 不执行
  news_items: 8            # 每只股票放进候选包的新闻条数
  # 审核能否否决规则层的卖出信号？默认不能——止损永远优先
  can_veto_exits: false
  # 以下仅 mode: api 时使用
  api_model: claude-opus-5-5
  api_effort: high

# ---- 情绪指标（scan 时计算，写进候选包）----
sentiment:
  sectors: [Semiconductor, Software, Technology]   # Webull 板块涨跌家数，按名称关键字匹配
  flow_symbols: [QQQ, SOXL, SOXS]                  # 看大单资金流向的标的

# ---- 对冲：Claude 市场研判偏空时可以开的小额对冲仓位（不需要均线信号）----
hedge:
  enabled: false               # 做空一侧改由 swing 战术层负责（回测验证过），这里关闭避免重复
  instruments: [SOXS]          # 只允许这些标的做对冲，而且必须在标的池里
  min_confidence: 0.7          # 研判为 risk_off 且置信度 ≥ 这个值才允许
  max_position_pct: 0.03       # 单个对冲仓位最多占本金 3%（名义金额，不再按杠杆缩小）
  max_hold_days: 10            # 最多持有 10 个交易日
  atr_stop_mult: 2.0           # ATR 跟踪止损
  exit_when_view_changes: true # 最新研判不再是 risk_off 时卖出

# ---- 事件日历（宏观事件见 events.yaml，财报日期自动从 Webull 获取）----
events:
  enabled: true
  lookahead_hours: 24          # 重大宏观事件在这么多小时内公布（尚未公布）时……
  pre_event_size_factor: 0.5   # ……新开仓位乘这个系数（不影响卖出和对冲）
  earnings_blackout_days: 3    # 某只股票在几个交易日内发财报时，不买入这只

# ---- 风控层（对所有模式生效，包括回测）----
risk:
  max_position_pct: 0.10       # 单只股票最多占总资产 10%
  max_positions: 8             # 最多同时持仓数
  max_per_group: 2             # 同一板块最多同时持有几只
  max_order_notional: 5000     # 单笔订单金额上限（美元）
  max_daily_loss_pct: 0.03     # 当日亏损超过 3% 停止开新仓
  cash_buffer_pct: 0.05        # 保留 5% 现金
  min_order_notional: 100      # 低于此金额的订单忽略
  # 系统可动用的本金上限（美元）。共享沙盒账户里有上千万虚拟资金，按这个数来算仓位才贴近真实
  max_capital: 100000
  # 只管理系统自己买入的持仓；账户里手动买的或别人的股票一律不碰
  manage_only_own_positions: true

# ---- 订单 ----
order:
  type: LIMIT                  # LIMIT 或 MARKET
  limit_offset_bps: 20         # 限价相对最新价的偏移（买入加价 / 卖出减价），单位 bp
  time_in_force: DAY
  # 交易时段: CORE = 常规时段 9:30-16:00 ET
  #          ALL = 盘前+常规+盘后 4:00-20:00 ET
  #          NIGHT = 夜盘 20:00-4:00 ET
  #          ALL_DAY = 24 小时（周一到周五）
  # 非 CORE 时段一律用限价单（自动强制）。夜盘流动性差、价差大，成交价可能不理想
  trading_session: ALL_DAY

# ---- 回测 ----
backtest:
  initial_cash: 100000
  commission_per_trade: 0.0
  slippage_bps: 5
  bars: 1200                   # Webull 单次最多 1200 根日线（约 4.7 年）

# ===== 半导体短线系统（SOXL / SOXS）=====
# 战术层：夜盘 4 个检查时点，SOXL 相对昨收 ≥±3% 且 KOSPI 综合指数同方向 ≥1% → 当天顺势买 SOXL / SOXS，
#         仓位按信号强弱 33%～66%；盘前 / 常规时段盈利加仓到 130%；止损 6%、加仓后回撤 6% 止盈，卖出后反弹 3% 买回（不限次数）；
#         收盘前平仓，不持仓过夜；方向再由 Claude 每天的市场研判过滤（这一层没法回测）。
# 核心层：日线长周期只做多。现在不是牛市，先关闭。
swing:
  core:
    enabled: false
    index: SOXX
    long: SOXL
    allocation: 0.30
    rebalance_band: 0.05
  tactical:
    enabled: true
    checkpoints: ["21:00", "23:00", "01:30", "04:00"]   # 美东时间；北京冬令时 10:00 / 12:00 / 14:30 / 17:00
    exit: "15:55"            # 北京冬令时 04:55
    threshold: 0.03          # SOXL 相对昨收涨跌 ≥3%
    korea: KOSPI
    korea_confirm: 0.01      # KOSPI 当天同方向 ≥1%
    capital: 3000            # 系统本金（独立记账，和沙盒账户里的几千万虚拟资金无关）
    position_frac: 0.33      # 固定仓位模式（sizing.mode: fixed）时用
    stop_pct: 0.06           # 软件止损：跌破持仓均价 6%
    reentry: true
    rebound_pct: 0.03        # 卖出（止损 / 止盈）后从最低点反弹 3% 就按原方向买回
    max_reentries: null      # 一天买回次数：null = 不限
    last_reentry: "15:00"
    # 融资与盈利加仓：夜盘不能融资（最多 100%）；盘前 / 常规时段最多 130%（需要账户对 SOXL/SOXS 有融资额度）
    max_frac_ovn: 1.0
    max_frac: 1.3
    add_step: 0.03           # 比上一次买入价再涨 3% 就加仓
    add_frac: 0.33           # 每次加 33% 权益
    add_from: "04:00"        # 盘前开始才加仓（北京冬令时 17:00）
    add_last: "15:00"        # 15:00 ET 以后不再加仓
    trail_after_add: 0.06    # 加过仓后，从持仓最高价回撤 6% 全部卖出（之后反弹 3% 再买回）
    trail_pct: 0.07          # 移动止损（2026-11-09 加）：不管加没加仓，从持仓最高价回撤 7% 就卖，之后反弹 3% 买回
    #   针对"整体还在涨但开盘后急跌"（如 11/6 盘前 +21% → 开盘后 +7.7%）。回测 6~10% 都不比不设差，7% 最好：
    #   124 天 +274% / 回撤 -13.4%（不设 +243% / -14.7%）；最近 3 个月 KOSPI 5 分钟线 +66% / -8.4%（不设 +62% / -10.2%）
    #   同时测过、但变差没用的：跌破常规时段 VWAP 离场或反手、跌破开盘区间离场、冲高回落反手做空、
    #   美股开盘后顺势开仓、韩国收盘后 SOXL 猛涨猛跌就不看韩国
    # 回测（124 天，本金 3000，旧的 4 时点逻辑，KOSPI 昨收修正前）：+184%，最大回撤 -18%，最差一天 -11.7%
    poll_seconds: 60
    sides: [long, short]
    view_gate: true          # 用 Claude 当天的市场研判过滤方向
    view_min_confidence: 0.7 # 研判置信度达到这个值才限制方向
    # 分时路径（2026-11-09 加）：21:00–04:00 ET 每分钟扫描，不只在 4 个时点看；同时看昨收以来的高低点
    #   回测（124 天，本金 3000，KOSPI 昨收用官方收盘价）：+243%，最大回撤 -14.7%，最差一天 -9.1%（只看 4 个时点：+158% / -16.2% / -11.7%）
    #   夜盘滑点按 0.3%：+209% / -14.3% / -7.6%（时点版 +156% / -15.4% / -11.8%）
    #   最近 3 个月用 KOSPI 5 分钟线：+62% / -10.2%（时点版 +50% / -12.4%）；滑点 0.3% 时两者差不多（+51% vs +53%）
    #   从 20:00 夜盘一开盘就扫描会变差（+175% / -22.4%），第一个小时噪音大，所以从 21:00 开始
    #   追 V 形反转（从低点反弹 6~8% 就反手）、或者 SOXL / KOSPI 都按当天低点高点起算（-3% 拉到 0 算涨 3%）都明显变差，所以不用
    path:
      enabled: true
      scan: continuous       # checkpoints = 只在 4 个时点看（旧逻辑）
      scan_from: "21:00"     # 北京冬令时 10:00
      scan_to: "04:00"       # 北京冬令时 17:00
      vwap_filter: false     # 回测里略差
      veto_pct: 0.06         # 想做空但已经从低点反弹 ≥6%（或想做多但已经从高点回落 ≥6%）→ 不做
      reversal_pct: null     # 反转信号：关闭
    # 动态仓位 = 33% × 信号强弱倍数，限制在 15%～80%
    #   信号强弱倍数 = min(SOXL 涨跌 / 3%, KOSPI 涨跌 / 1%)，在 1～signal_cap 之间（全部用当天实时数据，没有滞后）
    #   趋势效率（过去 10 天）有 4～6 天滞后、而且会压缩趋势反转时的交易，已关闭（use_trend_efficiency: false）
    #   回测（124 天）：平均仓位 50%，+101%，最大回撤 -12.2%（固定 33%：+51% / -9.6%）
    #   改成 mode: fixed 就回到固定 position_frac
    sizing:
      mode: dynamic
      base: 0.33
      signal_cap: 2.0
      use_trend_efficiency: false
      trend_index: SOXX
      er_window: 10
      er_tiers: [[0.2, 0.6], [0.4, 1.0], [99, 1.3]]
      min: 0.15
      max: 0.80
  order:
    type: LIMIT
    limit_offset_bps: 30     # 限价 = 最新价 ± 0.3%（夜盘 / 盘前价差大）
    time_in_force: DAY
    trading_session: ALL_DAY
