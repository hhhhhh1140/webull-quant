# ===== webull-quant 配置 =====

# 交易标的池，按板块分组（同时作为下单白名单，池外股票一律拒绝）
# 同一板块最多同时持有 risk.max_per_group 只，避免高度相关的股票一起买满
universe:
  index:     [SPY, QQQ]
  megacap:   [AAPL, MSFT, NVDA, AMZN, GOOGL, META]
  semis:     [AMD, AVGO, TSM]
  memory:    [MU, WDC, STX, SNDK]          # 存储
  optical:   [COHR, LITE, FN, CIEN, AAOI]  # 光模块 / 光通信
  # SOXL / SOXS 由半导体波段系统（下面的 swing）专门管理，不放在选股池里，避免两套系统交易同一只
  defensive: [KO, MCD]

# 杠杆 / 反向 ETF：仓位按杠杆倍数缩小；反向 ETF 不受大盘过滤限制（大盘越弱越可能有信号）
instruments:
  SOXL: {leverage: 3}
  SOXS: {leverage: 3, inverse: true}

# 执行模式:
#   dry_run  - 只打印决策和订单，不调用下单接口
#   paper    - 本地模拟撮合（不连 Webull 下单）
#   webull   - 调用 Webull 下单接口（环境由 .env 的 WEBULL_ENVIRONMENT 决定）
mode: dry_run

# 实盘总开关。即使 WEBULL_ENVIRONMENT=prod，这里不为 true 也不会下实盘单。
# 另外运行时还需要加 --confirm-live 参数。三道锁缺一不可。
live_trading_enabled: false

# ---- 独立个股筛选规则 ----
strategy:
  sma_fast: 50
  sma_slow: 200
  rsi_period: 14
  rsi_max_entry: 70        # RSI 高于此值不追高
  momentum_lookback: 20    # 20 日动量需 > 0
  atr_period: 14
  atr_stop_mult: 2.5       # 跟踪止损 = 最高收盘价 - N * ATR
  exit_below_fast_sma: true
  # 反向 ETF（instruments 里 inverse: true）专用的短线规则
  # 回测（2022-2026）里这套规则是亏的：23 笔、胜率 17%、合计 -1,453。先在沙盒里前向观察，实盘前建议关掉
  inverse_rule:
    enabled: true              # false = 不再买入反向 ETF（已有持仓仍按规则卖出）
    sma_fast: 20
    sma_slow: 50
    momentum_lookback: 10
    rsi_max_entry: 80
    atr_stop_mult: 2.0         # 比普通股票更紧
    max_hold_days: 15          # 杠杆 ETF 每天重置会损耗，持有满 15 个交易日强制卖出
    require_weak_index: true   # 至少一个大盘指数跌破 SMA50 才允许买入
  # 大盘趋势过滤：基准指数跌破长期均线时停止开新仓，只执行卖出和止损
  market_filter:
    enabled: true
    symbols: [SPY, QQQ]
    ma: sma_slow             # sma_slow = SMA200（长期趋势）；sma_fast = SMA50（更敏感）
    mode: any                # any = 任一指数走弱就停；all = 全部走弱才停

# ---- 独立个股候选扫描 ----
ai:
  mode: "off"
  news_items: 8

# ---- 情绪指标（scan 时计算，写进候选包）----
sentiment:
  sectors: [Semiconductor, Software, Technology]   # Webull 板块涨跌家数，按名称关键字匹配
  flow_symbols: [QQQ, SOXL, SOXS]                  # 看大单资金流向的标的

# ---- 独立个股规则的旧版对冲配置 ----
hedge:
  enabled: false               # 做空一侧改由 swing 战术层负责（回测验证过），这里关闭避免重复
  instruments: [SOXS]          # 只允许这些标的做对冲，而且必须在标的池里
  min_confidence: 0.7          # 研判为 risk_off 且置信度 ≥ 这个值才允许
  max_position_pct: 0.03       # 单个对冲仓位最多占本金 3%（名义金额，不再按杠杆缩小）
  max_hold_days: 10            # 最多持有 10 个交易日
  atr_stop_mult: 2.0           # ATR 跟踪止损
  exit_when_view_changes: true # 最新研判不再是 risk_off 时卖出

# ---- 事件日历（宏观事件见 events.yaml，财报日期自动从 Webull 获取）----
events:
  enabled: true
  lookahead_hours: 24          # 重大宏观事件在这么多小时内公布（尚未公布）时……
  pre_event_size_factor: 0.5   # ……新开仓位乘这个系数（不影响卖出和对冲）
  earnings_blackout_days: 3    # 某只股票在几个交易日内发财报时，不买入这只

# ---- 风控层（对所有模式生效，包括回测）----
risk:
  max_position_pct: 0.10       # 单只股票最多占总资产 10%
  max_positions: 8             # 最多同时持仓数
  max_per_group: 2             # 同一板块最多同时持有几只
  max_order_notional: 5000     # 单笔订单金额上限（美元）
  max_daily_loss_pct: 0.03     # 当日亏损超过 3% 停止开新仓
  cash_buffer_pct: 0.05        # 保留 5% 现金
  min_order_notional: 100      # 低于此金额的订单忽略
  # 系统可动用的本金上限（美元）。共享沙盒账户里有上千万虚拟资金，按这个数来算仓位才贴近真实
  max_capital: 100000
  # 只管理系统自己买入的持仓；账户里手动买的或别人的股票一律不碰
  manage_only_own_positions: true

# ---- 订单 ----
order:
  type: LIMIT                  # LIMIT 或 MARKET
  limit_offset_bps: 20         # 限价相对最新价的偏移（买入加价 / 卖出减价），单位 bp
  time_in_force: DAY
  # 交易时段: CORE = 常规时段 9:30-16:00 ET
  #          ALL = 盘前+常规+盘后 4:00-20:00 ET
  #          NIGHT = 夜盘 20:00-4:00 ET
  #          ALL_DAY = 24 小时（周一到周五）
  # 非 CORE 时段一律用限价单（自动强制）。夜盘流动性差、价差大，成交价可能不理想
  trading_session: ALL_DAY

# ---- 回测 ----
backtest:
  initial_cash: 100000
  commission_per_trade: 0.0
  slippage_bps: 5
  bars: 1200                   # Webull 单次最多 1200 根日线（约 4.7 年）

# 常规时段 5 分钟波段策略，scalp backtest 与 scalp paper 共用
scalp:
  capital: 3000                # 独立模拟本金（美元）
  notional: 1000               # 每笔最多使用的现金（美元），只买整股
  max_trades: 12               # 每个交易日最多开仓次数
  spread_bps: 4                # 假设的完整买卖点差，每次成交计入一半
  slippage_bps: 3              # 每次成交的额外滑点，单位 bp
  fee_per_order: 0.10          # 每次成交的模拟费用（美元）

# ===== SOXL / SOXS 三票制双层策略 =====
# 核心层与夜盘战术层共享独立本金。按三票结果切换方向，并按规则直接执行。
swing:
  market_source: futu          # 统一使用富途 OpenD 24h 1m/5m/日线行情（含夜盘，实盘免 Webull 夜盘订阅；可改 webull / auto）
  core:
    enabled: false
    index: SOXX
    long: SOXL
    allocation: 0.30
    rebalance_band: 0.05
  tactical:
    enabled: true
    checkpoints: ["21:00", "23:00", "01:30", "04:00"]   # 美东时间；北京冬令时 10:00 / 12:00 / 14:30 / 17:00
    exit: "15:55"            # 北京冬令时 04:55
    threshold: 0.03          # SOXL 相对昨收涨跌 ≥3%
    korea: KOSPI
    korea_confirm: 0.01      # KOSPI 当天同方向 ≥1%
    capital: 3000            # 系统本金（独立记账，和沙盒账户里的几千万虚拟资金无关）
    position_frac: 1.0       # 最高收益全仓版（100% 仓位，不加仓）
    stop_pct: 0.06           # 第 1 腿软件止损：跌破持仓均价 6%
    reentry: true
    rebound_pct: 0.03        # 卖出后从最低点反弹 3% 就按原方向买回
    max_reentries: 1         # 最多买回 1 次（日内只用 1 次 6% 窄止损）
    reentry_position_frac: 1.0   # 第 2 腿使用买回时的策略资金
    reentry_stop_pct: 0.06       # 第 2 腿成本下方 6% 固定止损，尾盘必平
    last_reentry: "15:00"
    # 全仓模式不融资、不加仓
    max_frac_ovn: 1.0
    max_frac: 1.0
    add_step: null
    add_frac: 0.33
    add_from: "04:00"
    add_last: "15:00"
    trail_after_add: null
    trail_pct: 0.08          # 第 1 腿移动止损：从持仓最高价回撤 8% 就卖，之后反弹 3% 买回
    # 三票制双层动态切换（沙盒逻辑，研究回放结果见 README）：
    #   SOXX 三票（Donchian 20/10 + SMA50/Mom20 + EMA 10/30）>= +2 票：核心层全仓持 SOXL 过夜，
    #   从日内最高价回撤 12% 止损；次日起在常规盘较上一交易日常规盘收盘价上涨 5% 买回。
    #   三票 < +2 票：清空核心仓，切入 5 分钟夜盘抢跑战术层（<= -2 票时只做空 SOXS，禁做多）。
    trend_switch:
      enabled: true
      index: SOXX
      core_symbol: SOXL
      core_frac: 1.0
      trail_pct: 0.12
      rebuy_pct: 0.05
      rebuy_session: RTH
      core_session_start: "09:30"
    poll_seconds: 60
    sides: [long, short]
    # 宏观利率门控（A 版）：^IRX（13周短债）且 ^TNX（10年美债）昨日收盘均高于 60 日均线才允许夜盘做空 SOXS
    macro_short_gate:
      enabled: true
      symbols: ["^IRX", "^TNX"]
      sma_window: 60
    # 暴跌极值反转抓底（模式 A）：SOXL/SOXS 单日常规盘收盘暴跌 <= -25% 时，
    # 收盘后（16:00 ET / 半日市 13:00 ET）起至次日 09:45 ET 用 1 分钟线右侧确认抓底（豁免三票/利率门控）
    crash_reversal:
      enabled: true
      drop_threshold: -0.25
      start_delay_minutes: 0
      entry_end: "09:45"
      wait_minutes: 20
      bounce_pct: 0.02
      ema_window: 20
      position_frac: 1.0
      stop_pct: 0.10
      trail_arm_pct: 0.12
      trail_pct: 0.10
    path:
      enabled: true
      scan: continuous       # 21:00–04:00 ET 每分钟连续扫描
      scan_from: "21:00"     # 北京冬令时 10:00
      scan_to: "04:00"       # 北京冬令时 17:00
      vwap_filter: false
      veto_pct: 0.06         # 想做空但已经从低点反弹 ≥6%（或想做多但已经从高点回落 ≥6%）→ 不做
      reversal_pct: null
    sizing:
      mode: fixed            # 100% 全仓（改回 dynamic 即恢复原 33%~66% 动态仓位）
      base: 0.33
      signal_cap: 2.0
      use_trend_efficiency: false
      trend_index: SOXX
      er_window: 10
      er_tiers: [[0.2, 0.6], [0.4, 1.0], [99, 1.3]]
      min: 0.15
      max: 0.80
  order:
    type: LIMIT
    limit_offset_bps: 30     # 限价 = 最新价 ± 0.3%（夜盘 / 盘前价差大）
    time_in_force: DAY
    trading_session: ALL_DAY

# ===== 三层每日开盘前公允价值系统（python -m wquant fair-value）=====
fair_value:
  peer_window: 60            # 第 1 层：同板块 + 大盘日收益因子回归窗口（交易日）
  peer_horizon: 5            # 第 1 层：计算板块相对偏离的回溯锚点（交易日）
  peer_reversion_frac: 0.50  # 第 1 层：短期偏离回归阻尼系数
  peer_ridge_alpha: 2.0      # 第 1 层 Ridge 正则系数
  stat_train_window: 252     # 第 2 层：短期量价模型滚动训练窗（交易日）
  stat_horizon: 3            # 第 2 层：预测目标周期（交易日）
  stat_ridge_alpha: 80.0     # 第 2 层 Ridge 正则系数（强正则防过拟合）
  fund_pull_strength: 0.12   # 第 3 层：基本面锚向当日公允价的有界引力系数
  fund_discount_rate: 0.08   # 第 3 层：分析师 12 个月目标价折现率
  earnings_window_days: 3    # 财报前后 N 个交易日自动降权历史板块回归
  weights:
    peer: 0.35               # 第 1 层基础权重（再按拟合优度 R² 动态缩放）
    stat: 0.50               # 第 2 层基础权重
    fund: 0.15               # 第 3 层基础权重（ETF 自动跳过）
  backtest_eval_days: 500    # Walk-Forward 回测评估交易日数
  backtest_retrain_every: 5  # 回测中第 2 层重训间隔（交易日）

# ===== 动态公允价反复做 T（python -m wquant fv-t）=====
# 独立模拟账本（state/fv_t_book_<env>.json），与 swing（SOXL/SOXS）完全隔离
fv_t:
  groups: [semis, memory, optical]   # 回测多空差最强的三大高联动板块
  capital: 10000                     # 独立模拟本金（美元）
  notional_per_trade: 2500           # 单笔低买金额上限（美元）
  max_positions: 4                   # 最多同时持有 4 只做 T 仓位
  max_per_group: 2                   # 同一板块最多 2 只
  entry_z: -0.60                     # 低于动态公允价 ≥0.60σ 时低吸
  exit_z: 0.10                       # 回归到动态公允价上方 +0.10σ 时高卖止盈
  stop_pct: 0.06                     # 单笔硬止损 -6%
  max_hold_days: 5                   # 最长持有 5 个交易日
  require_soxx_above: -2             # SOXX 三票制 <= -2（熊市下跌趋势）时清仓并停买
  kospi_crash_pct: -2.0              # KOSPI 急跌 <= -2% 时暂停新开多单
  daily_loss_pct: 0.03               # 当日已实现亏损超 3% 熔断停开新仓
  poll_minutes: 15                   # --watch 常规时段轮询间隔（分钟）
  order:
    type: LIMIT
    limit_offset_bps: 20
    time_in_force: DAY
    trading_session: ALL_DAY
